# Auto-release: whenever a new version lands on main (a pom.xml version with no
# matching v* tag yet), tag it, build the plugin, and publish the GitHub Release
# automatically. This is idempotent and self-healing: if a tag exists but its
# release is missing, the release is created. Tag pushes made by the workflow
# token don't trigger other workflows, so everything is done here.
name: Auto Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Read version from pom.xml
        id: version
        run: |
          VERSION=$(grep -m1 '<version>' pom.xml | sed -n 's/.*<version>\(.*\)<\/version>.*/\1/p')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version from pom.xml: $VERSION"

      - name: Ensure version tag exists
        id: tag
        run: |
          if git tag -l "v${{ steps.version.outputs.version }}" | grep -q .; then
            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "v${{ steps.version.outputs.version }} tag already exists."
          else
            git tag "v${{ steps.version.outputs.version }}"
            git push origin "v${{ steps.version.outputs.version }}"
            echo "created=true" >> "$GITHUB_OUTPUT"
            echo "Created tag v${{ steps.version.outputs.version }}."
          fi

      - name: Skip if release already exists
        id: released
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v${{ steps.version.outputs.version }} already exists — nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Release v${{ steps.version.outputs.version }} missing — publishing."
          fi

      - name: Set up JDK 21
        if: steps.released.outputs.exists == 'false'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build with Maven
        if: steps.released.outputs.exists == 'false'
        run: mvn -B package -DskipTests

      - name: Generate changelog
        if: steps.released.outputs.exists == 'false'
        shell: bash
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          PREV=$(git tag --sort=-creatordate | awk 'NR==2 {print}')
          if [ -z "$PREV" ]; then
            RANGE="HEAD"
          else
            RANGE="$PREV..HEAD"
          fi
          {
            echo "## What's Changed"
            echo ""
            git log "$RANGE" --pretty=format:"* %s" 2>/dev/null || echo "(no commits found)"
            echo ""
            echo ""
            if [ -z "$PREV" ]; then
              echo "Release \`$TAG\`"
            else
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$PREV...$TAG"
            fi
          } > changelog.md
          echo "--- changelog.md ---"
          cat changelog.md

      - name: Create GitHub Release
        if: steps.released.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          body_path: changelog.md
          files: |
            target/UpdraftDuels-*.jar
            target/original-*.jar
