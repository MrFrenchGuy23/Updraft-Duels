# Auto-release: push a tag like `v1.0.0` and this builds the plugin,
# generates a changelog from the commits since the previous tag, and
# publishes a GitHub Release with the jar(s) attached.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build with Maven
        run: mvn -B package -DskipTests

      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          PREV=$(git tag --sort=-creatordate | head -n 2 | tail -n 1 || true)
          if [ -z "$PREV" ]; then
            RANGE="HEAD"
          else
            RANGE="$PREV..HEAD"
          fi
          {
            echo "## What's Changed"
            echo ""
            if [ -z "$PREV" ]; then
              git log "$RANGE" --pretty=format:"* %s" 2>/dev/null || echo "(no commits found)"
            else
              git log "$RANGE" --pretty=format:"* %s" 2>/dev/null || echo "(no commits found)"
            fi
            echo ""
            echo ""
            if [ -z "$PREV" ]; then
              echo "Release \`$TAG\`"
            else
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$PREV...$TAG"
            fi
          } > changelog.md
          echo "--- changelog.md ---"
          cat changelog.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: changelog.md
          files: |
            target/UpdraftDuels-*.jar
            target/original-*.jar
