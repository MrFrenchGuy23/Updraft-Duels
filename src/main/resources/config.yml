general:
  default-elo: 1000
  min-elo: 0
  combat-logger-timeout: 100
  freeze-on-countdown: true
  prevent-clip: false

duel:
  ranked-time-limit-seconds: 300
  allowed-team-sizes: [1, 2, 3, 4]
  countdown-seconds: 3
  max-pending-requests: 5
  # How long a duel request stays valid before it auto-expires (in seconds).
  request-expire-seconds: 60
  # Set to true to log arena boundary checks and duel teleports to the console.
  # Use this to debug players getting teleported to the wrong world or "can't leave arena" issues.
  debug: false
  # How far a player may fall below the arena before being pulled back up to their
  # spawn. Prevents falling through the arena into the void (and the "fake body" glitch).
  # Not applied to sumo/knockback or spleef rulesets where falling is the loss condition.
  arena-floor-pull-margin: 3
  # When true, direct duels (/duel <player>) with at least 2 available arenas let the
  # fighters vote on which arena to use before the countdown starts.
  vote-for-arena: true
  # How long the arena vote stays open (in seconds) if not everyone votes.
  vote-seconds: 8

scoreboard:
  enabled: true
  title: "&f&lDuel"
  # Placeholders: %team_a%, %team_b%, %arena%, %duration%, %ruleset%, %gamemode%, %score%, %elo%, %wins%, %losses%, %wl%
  # Use "" (empty) lines for separators or to skip lines.
  lines:
    - "%team_a% %team_b%"
    - ""
    - "&7Arena: &f%arena%"
    - "&7Duration: &f%duration%"
    - "&7Gamemode: &f%gamemode%"
    - "&7Ruleset: &f%ruleset%"
    - ""
    - "&7ELO: &f%elo%"
    - "&7W/L: &f%wl%"

arena:
  # Arenas where players may freely break/place blocks during a duel.
  # These bypass the default block-edit restriction (useful for buildpvp-style arenas).
  # Add the arena name exactly as created with /arena create.
  block-edit-whitelist: []

lobby:

anti-spam:
  duel-request-cooldown-seconds: 5
  queue-join-cooldown-seconds: 3
  tournament-join-cooldown-seconds: 10
  message-cooldown-seconds: 2

gate:
  enabled: true
  material: IRON_BARS
  animation-enabled: true
  animation-speed-ticks: 2
  pos1: {}
  pos2: {}

rtpqueue:
  # World(s) players are randomly teleported to when an RTP match is found.
  # A world is picked randomly per match. Leave empty to disable RTP queueing.
  # Single world: "rtp_world"
  # Multiple worlds:
  world:
    - "rtp_world_1"
    - "rtp_world_2"
  # Maximum distance from world origin (0,0) a player can be teleported.
  radius: 1000
  # Minimum distance between the two matched players.
  min-distance: 100
  # Countdown before the match starts.
  countdown-seconds: 5
  # Shown above the hotbar when a match is found. %world% = the RTP world.
  match-message: "&aMatch Found &7| &fTeleporting to the RTP world"

titles:
  match-found:
    title: "&aMatch Found"
    subtitle: "&7Teleporting to &f%arena%"
    fade-in: 10
    stay: 40
    fade-out: 10
    color: GREEN

database:
  type: SQLITE
  sqlite-file: data.db
  mysql:
    host: localhost
    port: 3306
    database: updraftduels
    username: root
    password: ""
    use-ssl: false

party:
  max-size: 10
  leader-accepts: true
  items:
    party:
      slot: 0
      material: PLAYER_HEAD
      name: "&fParty Menu"
      lore:
        - "&7Click to open the party menu"
      command: "party gui"
    settings:
      slot: 1
      material: NETHER_STAR
      name: "&fDuel Settings"
      lore:
        - "&7Click to open the settings menu"
      command: "settings"
  broadcast:
    join: true
    leave: true
    kick: true
    promote: true
    duel-challenge: true

friends:
  max-friends: 100
  notify-online: true
  auto-accept-from-friends: false

placeholder-api:
  no-data: "N/A"

tournament:
  reward-command: "give %player% diamond 3"
  min-players: 4
  default-team-size: 1
  require-tourney-permission: true
  tourney-permission: "updraftduels.tourney.bc"
  countdown-seconds: 15
  announce-interval-seconds: 4

divisions:
  enabled: true
  start-matches: 10
  increase-per-rank: 0
  ranks:
    0:
      name: "Copper"
      color: "&6"
      material: COPPER_BLOCK
    1:
      name: "Iron"
      color: "&f"
      material: IRON_BLOCK
    2:
      name: "Gold"
      color: "&e"
      material: GOLD_BLOCK
    3:
      name: "Diamond"
      color: "&b"
      material: DIAMOND_BLOCK
    4:
      name: "Netherite"
      color: "&8"
      material: NETHERITE_BLOCK

matchmaking:
  # Modes: CASUAL, COMPETITIVE, BOTH
  # CASUAL = no ELO changes, COMPETITIVE = ELO changes, BOTH = queue accepts both
  default-mode: BOTH
  # Competitive requires this many wins to unlock
  competitive-min-wins: 15

season:
  current-season: 1
  length-days: 30
  start-time: 0
  end-time: 0
  decay-enabled: true
  decay-days-inactive: 14
  decay-amount: 50

voting:
  vote-time-seconds: 15
  require-all-votes: false

anticheat:
  bypass-during-duel: true

update-checker:
  enabled: true
  # Log the check result to the console on startup.
  notify-console: true
  # Remind admins on join when an update is available.
  notify-players: true
  notify-permission: "updraftduels.admin"
  # Repository that hosts the releases (used by the GitHub releases API).
  repo-owner: "MrFrenchGuy23"
  repo-name: "Updraft-Duels"

cosmetics:
  kill-effects-enabled: true
  victory-animations-enabled: true
  trails-enabled: true
  death-messages-enabled: true

death-messages:
  enabled: true
  killed: "&7%victim% was killed by %killer%"
  killed-item: "&7%victim% was killed by %killer% using %item%"
  fall: "&7%victim% fell to their death"
  lava: "&7%victim% burned to death"
  drown: "&7%victim% drowned"
  void: "&7%victim% fell out of the world"
  explosion: "&7%victim% blew up"
  cacti: "&7%victim% was pricked to death"
  starve: "&7%victim% starved to death"
  magic: "&7%victim% was killed by magic"
  default: "&7%victim% died"

rulesets: {}

ranks:
  order:
    - copper
    - iron
    - gold
    - diamond
    - netherite
  copper:
    color: "&6"
    elo-iii: 800
    elo-ii: 900
    elo-i: 1000
  iron:
    color: "&f"
    elo-iii: 1100
    elo-ii: 1200
    elo-i: 1300
  gold:
    color: "&e"
    elo-iii: 1400
    elo-ii: 1500
    elo-i: 1600
  diamond:
    color: "&b"
    elo-iii: 1700
    elo-ii: 1800
    elo-i: 1900
  netherite:
    color: "&8"
    elo-iii: 2000
    elo-ii: 2100
    elo-i: 2200
