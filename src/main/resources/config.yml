general:
  default-elo: 1000
  min-elo: 0
  combat-logger-timeout: 100
  freeze-on-countdown: true
  prevent-clip: false

duel:
  ranked-time-limit-seconds: 300
  allowed-team-sizes: [1, 2, 3, 4]
  countdown-seconds: 3
  max-pending-requests: 5
  # Set to true to log arena boundary checks and duel teleports to the console.
  # Use this to debug players getting teleported to the wrong world or "can't leave arena" issues.
  debug: false
  # How far a player may fall below the arena before being pulled back up to their
  # spawn. Prevents falling through the arena into the void (and the "fake body" glitch).
  # Not applied to sumo/knockback or spleef rulesets where falling is the loss condition.
  arena-floor-pull-margin: 3
  # When true, direct duels (/duel <player>) with at least 2 available arenas let the
  # fighters vote on which arena to use before the countdown starts.
  vote-for-arena: true
  # How long the arena vote stays open (in seconds) if not everyone votes.
  vote-seconds: 8

arena:
  # Arenas where players may freely break/place blocks during a duel.
  # These bypass the default block-edit restriction (useful for buildpvp-style arenas).
  # Add the arena name exactly as created with /arena create.
  block-edit-whitelist: []

lobby:

anti-spam:
  duel-request-cooldown-seconds: 5
  queue-join-cooldown-seconds: 3
  tournament-join-cooldown-seconds: 10
  message-cooldown-seconds: 2

gate:
  enabled: true
  material: IRON_BARS
  animation-enabled: true
  animation-speed-ticks: 2
  pos1: {}
  pos2: {}

rtpqueue:
  # World(s) players are randomly teleported to when an RTP match is found.
  # A world is picked randomly per match. Leave empty to disable RTP queueing.
  # Single world: "rtp_world"
  # Multiple worlds:
  world:
    - "rtp_world_1"
    - "rtp_world_2"
  # Maximum distance from world origin (0,0) a player can be teleported.
  radius: 1000
  # Minimum distance between the two matched players.
  min-distance: 100
  # Countdown before the match starts.
  countdown-seconds: 5
  # Shown above the hotbar when a match is found. %world% = the RTP world.
  match-message: "&aMatch Found &7| &fTeleporting to the RTP world"

titles:
  match-found:
    title: "&aMatch Found"
    subtitle: "&7Teleporting to &f%arena%"
    fade-in: 10
    stay: 40
    fade-out: 10
    color: GREEN

database:
  type: SQLITE
  sqlite-file: data.db
  mysql:
    host: localhost
    port: 3306
    database: updraftduels
    username: root
    password: ""
    use-ssl: false

party:
  max-size: 10
  leader-accepts: true
  items:
    party:
      slot: 0
      material: PLAYER_HEAD
      name: "&fParty Menu"
      lore:
        - "&7Click to open the party menu"
      command: "party gui"
    settings:
      slot: 1
      material: NETHER_STAR
      name: "&fDuel Settings"
      lore:
        - "&7Click to open the settings menu"
      command: "settings"
  broadcast:
    join: true
    leave: true
    kick: true
    promote: true
    duel-challenge: true

friends:
  max-friends: 100
  notify-online: true
  auto-accept-from-friends: false

placeholder-api:
  no-data: "N/A"

tournament:
  reward-command: "give %player% diamond 3"
  min-players: 4
  default-team-size: 1
  require-tourney-permission: true
  tourney-permission: "updraftduels.tourney.bc"
  countdown-seconds: 15
  announce-interval-seconds: 4

divisions:
  enabled: true
  start-matches: 10
  increase-per-rank: 0
  ranks:
    0:
      name: "Leather"
      color: "&6"
      material: LEATHER_HELMET
    1:
      name: "Chainmail"
      color: "&7"
      material: CHAINMAIL_HELMET
    2:
