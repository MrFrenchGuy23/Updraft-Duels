      color: "&a"
      material: EMERALD_BLOCK
    6:
      name: "Netherite"
      color: "&8"
      material: NETHERITE_HELMET
    7:
      name: "Master"
      color: "&d"
      material: NETHER_STAR
    8:
      name: "Legend"
      color: "&4"
      material: DRAGON_HEAD
    9:
